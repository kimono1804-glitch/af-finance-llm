# QLoRA fine-tune (train_qwen3.py). Defaults sized for an 8 GB RTX 5050 laptop GPU.
seed: 3407
model_name: unsloth/Qwen3-4B-unsloth-bnb-4bit
max_seq_length: 6144          # examples are ~2.5-5.5k tokens (Qwen splits numbers into digits)
load_in_4bit: true

dataset: dataset.jsonl
output_dir: outputs                 # checkpoints + logs (git-ignored)
adapter_dir: qwen3_4b_finance_lora_v2  # default adapter for run_assistant / eval / export (v2 won the 2026-10-23 eval); v1: qwen3_4b_finance_lora

lora:
  r: 32
  alpha: 32
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

train:
  epochs: 2
  per_device_batch_size: 1
  gradient_accumulation_steps: 8    # effective batch 8
  learning_rate: 2.0e-4
  warmup_steps: 10
  lr_scheduler: linear
  weight_decay: 0.01
  optim: adamw_8bit
  logging_steps: 5
  eval: true                        # evaluate loss on the held-out test split each epoch
  save_steps: 50
